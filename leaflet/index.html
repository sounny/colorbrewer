<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ColorBrewer for Leaflet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="main.css" />
</head>
<body>
<div id="map"></div>
<div class="controls">
  <h1>ColorBrewer for Leaflet</h1>
  <p class="tagline">Choose smart color schemes for your map data.</p>
  <label>Scheme:
    <select id="scheme"></select>
  </label>
  <label>Classes:
    <select id="classes">
      <option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
    </select>
  </label>
  <label>Classification:
    <select id="mode">
      <option value="quantile" selected>Quantile</option>
      <option value="equal">Equal interval</option>
    </select>
  </label>
  <label class="inline-toggle">
    <input type="checkbox" id="reverse" /> Reverse palette
  </label>
  <label>Layer:
    <select id="layer">
      <option value="states">States</option>
      <option value="counties" selected>Counties</option>
    </select>
  </label>
  <div id="scheme-info"></div>
  <div id="recommendation"></div>
</div>
<div id="legend"></div>
<div id="probe"></div>
<div id="export">
  <div><strong>Export:</strong></div>
  <div class="export-links">
    <a id="export-ase" download>ASE</a>
    <a id="export-gpl" download>GPL</a>
    <a id="export-clr" download>CLR</a>
    <button id="copy-js" type="button">JS</button>
    <button id="copy-css" type="button">CSS</button>
  </div>
  <textarea id="export-text" readonly></textarea>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../version2/colorbrewer_schemes.js"></script>
<script src="main.js"></script>
</body>
</html>
